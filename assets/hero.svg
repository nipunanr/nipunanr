<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Animated cartoon developer coding, with the name Nipuna Rangika">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1f"/><stop offset="1" stop-color="#0A214F"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ABC9"/><stop offset="1" stop-color="#7ee7ff"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .star{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .float{animation:fl 6s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .blink{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
    @keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    .tapL{animation:tp .5s ease-in-out infinite}
    .tapR{animation:tp .5s ease-in-out .25s infinite}
    @keyframes tp{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
    .code{transform-box:fill-box;transform-origin:left center;animation:cd 5s ease-in-out infinite}
    @keyframes cd{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .steam{animation:st 2.4s ease-in-out infinite}
    @keyframes st{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
    .head{animation:hd 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    @keyframes hd{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
    .wave{animation:wv 2s ease-in-out infinite}
    @keyframes wv{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
    .cursor{animation:cu 1s steps(1) infinite}
    @keyframes cu{50%{opacity:0}}
    .t{opacity:0;animation:ty 12s infinite}
    .t2{animation-delay:3s}.t3{animation-delay:6s}.t4{animation-delay:9s}
    @keyframes ty{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-8px)}}
    .in{animation:fi 1.2s ease-out both}
    @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  </style>

  <rect width="900" height="320" rx="18" fill="url(#bg)"/>
  <g fill="#fff">
    <circle class="star" cx="60" cy="40" r="1.6"/><circle class="star" style="animation-delay:.7s" cx="230" cy="28" r="1.2"/>
    <circle class="star" style="animation-delay:1.4s" cx="420" cy="52" r="1.8"/><circle class="star" style="animation-delay:2s" cx="560" cy="30" r="1.2"/>
    <circle class="star" style="animation-delay:.4s" cx="700" cy="46" r="1.6"/><circle class="star" style="animation-delay:1.1s" cx="850" cy="34" r="1.3"/>
    <circle class="star" style="animation-delay:1.8s" cx="110" cy="290" r="1.3"/><circle class="star" style="animation-delay:.9s" cx="470" cy="296" r="1.5"/>
  </g>

  <!-- Text -->
  <g class="in">
    <text x="44" y="96" font-size="22" fill="#9fb4d9">Hi there, I'm</text>
    <text x="44" y="158" font-size="58" font-weight="800" fill="url(#name)">Nipuna Rangika</text>
    <text x="44" y="196" font-size="20" font-weight="600" fill="#ffffff">Assistant Manager - Solutions @ MISL</text>
  </g>
  <g class="mono" font-size="17" fill="#00ABC9">
    <text x="44" y="240" fill="#5d7299">&gt;</text>
    <text class="t" x="64" y="240">Solution Architecture</text>
    <text class="t t2" x="64" y="240">Backend &amp; Full-Stack Delivery</text>
    <text class="t t3" x="64" y="240">System Integration &amp; Automation</text>
    <text class="t t4" x="64" y="240">Scalable Web &amp; Mobile Apps</text>
    <text class="cursor" x="330" y="240" fill="#ffffff">_</text>
  </g>

  <!-- Floating symbols -->
  <g class="mono" font-size="22" font-weight="700">
    <text class="float" x="490" y="90" fill="#00ABC9">{ }</text>
    <text class="float" style="animation-delay:1.5s" x="640" y="70" fill="#7ee7ff">&lt;/&gt;</text>
    <text class="float" style="animation-delay:3s" x="830" y="120" fill="#f5a623">( )</text>
    <text class="float" style="animation-delay:2s" x="860" y="230" fill="#a78bfa">;</text>
  </g>

  <!-- Desk -->
  <rect x="480" y="262" width="400" height="12" rx="6" fill="#16305f"/>
  <rect x="510" y="274" width="10" height="34" fill="#16305f"/><rect x="840" y="274" width="10" height="34" fill="#16305f"/>

  <!-- Monitor -->
  <rect x="500" y="112" width="170" height="116" rx="8" fill="#0d1b38" stroke="#00ABC9" stroke-width="3"/>
  <rect x="580" y="228" width="10" height="22" fill="#00ABC9"/><rect x="560" y="248" width="50" height="6" rx="3" fill="#00ABC9"/>
  <g>
    <rect class="code" x="514" y="126" width="70" height="7" rx="3.5" fill="#00ABC9"/>
    <rect class="code" style="animation-delay:.3s" x="528" y="142" width="100" height="7" rx="3.5" fill="#a78bfa"/>
    <rect class="code" style="animation-delay:.6s" x="528" y="158" width="60" height="7" rx="3.5" fill="#f5a623"/>
    <rect class="code" style="animation-delay:.9s" x="542" y="174" width="90" height="7" rx="3.5" fill="#4ade80"/>
    <rect class="code" style="animation-delay:1.2s" x="528" y="190" width="110" height="7" rx="3.5" fill="#7ee7ff"/>
    <rect class="code" style="animation-delay:1.5s" x="514" y="206" width="50" height="7" rx="3.5" fill="#00ABC9"/>
  </g>

  <!-- Keyboard -->
  <rect x="620" y="250" width="110" height="12" rx="4" fill="#243b6b"/>

  <!-- Mug -->
  <g>
    <rect x="800" y="236" width="26" height="26" rx="5" fill="#00ABC9"/>
    <path d="M826 242h6a5 5 0 0 1 0 12h-6" fill="none" stroke="#00ABC9" stroke-width="4"/>
    <path class="steam" d="M807 230c-4-6 4-8 0-14" fill="none" stroke="#9fb4d9" stroke-width="2" stroke-linecap="round"/>
    <path class="steam" style="animation-delay:1.2s" d="M818 230c-4-6 4-8 0-14" fill="none" stroke="#9fb4d9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Character -->
  <g>
    <!-- torso -->
    <path d="M735 262c-6-40-2-70 8-84h56c10 14 14 44 8 84z" fill="#00ABC9"/>
    <path d="M760 178h30v12a15 15 0 0 1-30 0z" fill="#0A214F" opacity=".35"/>
    <!-- arms -->
    <g class="tapL"><path d="M748 200c-16 8-30 26-34 46" fill="none" stroke="#00ABC9" stroke-width="13" stroke-linecap="round"/><circle cx="712" cy="248" r="8" fill="#f2c9a0"/></g>
    <g class="tapR"><path d="M752 208c-12 12-22 28-24 40" fill="none" stroke="#0090ab" stroke-width="13" stroke-linecap="round"/><circle cx="728" cy="250" r="8" fill="#f2c9a0"/></g>
    <!-- head -->
    <g class="head">
      <rect x="766" y="160" width="18" height="22" rx="6" fill="#e6b88a"/>
      <circle cx="775" cy="140" r="32" fill="#f2c9a0"/>
      <path d="M743 138c-2-26 16-40 34-38 18 2 32 16 30 36-10-12-22-16-34-16-12 0-22 6-30 18z" fill="#2b1d16"/>
      <!-- glasses -->
      <g fill="none" stroke="#0A214F" stroke-width="2.5"><circle cx="762" cy="144" r="9"/><circle cx="786" cy="144" r="9"/><path d="M771 144h6"/></g>
      <g class="blink"><circle cx="760" cy="144" r="3.4" fill="#0A214F"/><circle cx="784" cy="144" r="3.4" fill="#0A214F"/></g>
      <path d="M764 160q10 8 20 0" fill="none" stroke="#a5563a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
