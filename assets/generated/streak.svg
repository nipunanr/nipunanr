<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Contribution streak"><style>.fade{animation:f .8s ease-out both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left center;animation:g 1.2s ease-out both}@keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><rect x=".5" y=".5" width="899" height="129" rx="14" fill="#050d1f" stroke="#16305f"/><g class="fade" style="animation-delay:0.0s"><text x="150" y="72" font-size="40" font-weight="800" fill="#00ABC9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">2,801</text><text x="150" y="102" font-size="14" fill="#9fb4d9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contributions (last year)</text></g><g class="fade" style="animation-delay:0.2s"><text x="450" y="72" font-size="40" font-weight="800" fill="#00ABC9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4</text><text x="450" y="102" font-size="14" fill="#9fb4d9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Current streak</text></g><g class="fade" style="animation-delay:0.4s"><text x="750" y="72" font-size="40" font-weight="800" fill="#00ABC9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6</text><text x="750" y="102" font-size="14" fill="#9fb4d9" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Longest streak</text></g></svg>